# =============================================================================
# デプロイパイプライン / Deploy Pipeline
#
# AI ネイティブ開発方法論の deploy パイプライン（ai-native-dev-operation-template）を
# 本アプリへ適用したもの。テストゲート（単体 → 結合 → シナリオ）を通過した場合のみ
# デプロイし、いずれかが失敗したらデプロイを中断する。「何がどのように失敗したか」は
# Step Summary とアーティファクト（テストゲート: deploy-logs）に残る。
#
# 本アプリ固有の適用（テンプレートの構造 + 本アプリの実処理）:
#   - デプロイ対象は 4 系統: home（Firebase Hosting デフォルトサイト）/
#     company・intelligence（Firebase Hosting マルチサイトの専用サイト）/ api（Cloud Run + RDS PostgreSQL）
#   - テストゲートは repository variables ではなく本アプリの実コマンドを直接実行する
#     （単体 = home/company/intelligence/api の vitest + typecheck、結合 = api の実 PostgreSQL 統合テスト、
#      シナリオ = デプロイ成果物のビルド検証 各フロント:generate + api:build）
#   - 環境（environment）: production = Firebase live チャネル + Cloud Run 本番サービス、
#     staging = Firebase プレビューチャネル（api の staging は別途プロビジョニングが必要なため対象外）
#   - main への push は従来どおり production へ自動デプロイ（開発原則1）。手動実行で環境を選択できる
#   - company / intelligence は Hosting のサイト ID を secrets から受け取り、デプロイ時に
#     .firebaserc を生成してターゲット（firebase.json の hosting.target）へ紐付ける
#     （リポジトリへプロジェクト固有値をハードコードしない方針の維持）。サイト用 secret 未登録なら
#     そのアプリのデプロイのみスキップし、他のデプロイは継続する（非ブロッキング。原則4）
#
# 必要な Repository secrets（scripts/setup-deploy-secrets.ps1 で設定。詳細は
# .ai-native/outputs/phase7/deploy-guide.md）:
#   [home]       FIREBASE_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID（必須）
#   [company]      FIREBASE_HOSTING_SITE_COMPANY（任意。未設定はスキップ）
#   [intelligence] FIREBASE_HOSTING_SITE_INTELLIGENCE（任意。未設定はスキップ）
#   [api]          GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID, GCP_REGION, CLOUD_RUN_SERVICE,
#                  DATABASE_URL, DB_SSL, API_CORS_ORIGINS ほか
#                  （未設定なら api デプロイは警告を出してスキップ = 非ブロッキング。原則4）
#   ※ company / intelligence の API 接続には API_CORS_ORIGINS へ各サイトのオリジン追加が必要
# =============================================================================
name: デプロイパイプライン / Deploy Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'home/**'
      - 'company/**'
      - 'intelligence/**'
      - 'api/**'
      - 'shared/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/run-test-stage.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ先環境（Deploy target environment）'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# 同一環境への同時デプロイを禁止（push=production / 手動=選択環境。実行中はキャンセルしない）
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 事前検証: デプロイ先環境を確定し、必要な設定値（secrets）の有無を最初に確認する。
  # home（Firebase）に必要な secrets が欠けていれば即座に失敗させる。
  # api（Cloud Run）の secrets は任意で、欠けていれば api デプロイをスキップする（非ブロッキング）。
  # ---------------------------------------------------------------------------
  preflight:
    name: 事前検証（設定値チェック）
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      api_ready: ${{ steps.env.outputs.api_ready }}
      company_ready: ${{ steps.env.outputs.company_ready }}
      intelligence_ready: ${{ steps.env.outputs.intelligence_ready }}
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      HAS_FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID != '' }}
      HAS_COMPANY_SITE: ${{ secrets.FIREBASE_HOSTING_SITE_COMPANY != '' }}
      HAS_INTELLIGENCE_SITE: ${{ secrets.FIREBASE_HOSTING_SITE_INTELLIGENCE != '' }}
      HAS_GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
      HAS_GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID != '' }}
      HAS_GCP_REGION: ${{ secrets.GCP_REGION != '' }}
      HAS_CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE != '' }}
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - name: 環境と必須設定値の確認
        id: env
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'production' }}"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

          # --- home（Firebase Hosting）は必須 ---
          MISSING=""
          [ "$HAS_FIREBASE_SA" = "true" ]      || MISSING="${MISSING}\n- **FIREBASE_SERVICE_ACCOUNT**（repository secret）が未設定です"
          [ "$HAS_FIREBASE_PROJECT" = "true" ] || MISSING="${MISSING}\n- **FIREBASE_PROJECT_ID**（repository secret）が未設定です"

          if [ -n "$MISSING" ]; then
            {
              echo "## ❌ 事前検証失敗 — デプロイを中断します（環境: ${ENVIRONMENT}）"
              echo ""
              echo "home（Firebase Hosting）に必要な設定値が未登録です。\`scripts/setup-deploy-secrets.ps1\` で登録してください"
              echo "（手順書: \`.ai-native/outputs/phase7/deploy-guide.md\`）:"
              echo -e "$MISSING"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::home デプロイに必要な設定値が不足しています。Step Summary を確認してください。"
            exit 1
          fi

          # --- company / intelligence（Hosting マルチサイト）は任意。サイト用 secret があるときのみデプロイ ---
          COMPANY_READY=false
          [ "$HAS_COMPANY_SITE" = "true" ] && COMPANY_READY=true
          echo "company_ready=$COMPANY_READY" >> "$GITHUB_OUTPUT"
          INTELLIGENCE_READY=false
          [ "$HAS_INTELLIGENCE_SITE" = "true" ] && INTELLIGENCE_READY=true
          echo "intelligence_ready=$INTELLIGENCE_READY" >> "$GITHUB_OUTPUT"

          # --- api（Cloud Run）は任意。production かつ secrets が揃うときのみデプロイ ---
          API_READY=false
          if [ "$HAS_GCP_SA" = "true" ] && [ "$HAS_GCP_PROJECT" = "true" ] && [ "$HAS_GCP_REGION" = "true" ] \
             && [ "$HAS_CLOUD_RUN_SERVICE" = "true" ] && [ "$HAS_DATABASE_URL" = "true" ]; then
            API_READY=true
          fi
          echo "api_ready=$API_READY" >> "$GITHUB_OUTPUT"

          {
            echo "- ✅ **事前検証**: home 設定値は登録済み（環境: ${ENVIRONMENT}）"
            if [ "$COMPANY_READY" = "true" ]; then
              echo "- ✅ **company**: サイト設定あり（FIREBASE_HOSTING_SITE_COMPANY）"
            else
              echo "- ⚠️ **company**: FIREBASE_HOSTING_SITE_COMPANY が未登録のためスキップします（deploy-guide.md §1-11）"
            fi
            if [ "$INTELLIGENCE_READY" = "true" ]; then
              echo "- ✅ **intelligence**: サイト設定あり（FIREBASE_HOSTING_SITE_INTELLIGENCE）"
            else
              echo "- ⚠️ **intelligence**: FIREBASE_HOSTING_SITE_INTELLIGENCE が未登録のためスキップします（deploy-guide.md §1-11）"
            fi
            if [ "$ENVIRONMENT" != "production" ]; then
              echo "- ℹ️ **api**: staging は対象外です（フロントのみ staging プレビューへデプロイ）"
            elif [ "$API_READY" = "true" ]; then
              echo "- ✅ **api**: 設定値は揃っています（Cloud Run へデプロイします）"
            else
              echo "- ⚠️ **api**: 設定値が未登録のためスキップします（フロントのみデプロイ）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ 事前検証 OK（環境: ${ENVIRONMENT} / api_ready=${API_READY} / company_ready=${COMPANY_READY} / intelligence_ready=${INTELLIGENCE_READY}）"

  # ---------------------------------------------------------------------------
  # テストゲート: 単体 → 結合 → シナリオ の順に実行。前段が失敗した時点で以降は
  # 実行されず、デプロイは中断される。ログは run-test-stage.sh がアーティファクト化する。
  # ---------------------------------------------------------------------------
  test:
    name: テストゲート（単体・結合・シナリオ）
    needs: preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: akebono_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            home/package-lock.json
            company/package-lock.json
            intelligence/package-lock.json
            api/package-lock.json

      - name: 依存インストール（home / company / intelligence / api）
        run: |
          ( cd home && npm ci )
          ( cd company && npm ci )
          ( cd intelligence && npm ci )
          ( cd api && npm ci )

      - name: 単体テスト（home/company/intelligence/api の vitest + typecheck）
        env:
          STAGE_CMD: >-
            ( cd home && npm run typecheck && npm run test ) &&
            ( cd company && npm run typecheck && npm run test ) &&
            ( cd intelligence && npm run typecheck && npm run test ) &&
            ( cd api && npm run typecheck && npm run test )
        run: bash scripts/run-test-stage.sh "単体テスト" unit-test

      - name: 結合テスト（api の実 PostgreSQL 統合テスト）
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/akebono_test
          STAGE_CMD: cd api && npm run test:integration
        run: bash scripts/run-test-stage.sh "結合テスト" integration-test

      - name: シナリオテスト（デプロイ成果物のビルド検証）
        env:
          STAGE_CMD: >-
            ( cd home && npm run generate ) &&
            ( cd company && npm run generate ) &&
            ( cd intelligence && npm run generate ) &&
            ( cd api && npm run build )
        run: bash scripts/run-test-stage.sh "シナリオテスト（ビルド検証）" scenario-test

      - name: テストログをアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs
          path: .deploy-logs/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # デプロイ（home / Firebase Hosting）: 全テストゲート通過時のみ実行。
  # 環境で配信チャネルを切り替える（production=live / staging=プレビュー）。
  # ---------------------------------------------------------------------------
  deploy-home:
    name: デプロイ実行（home / Firebase Hosting）
    needs: [preflight, test]
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: home/package-lock.json

      - name: 依存インストール
        working-directory: home
        run: npm ci

      - name: 静的ビルド
        working-directory: home
        env:
          # 未設定なら完全モックモード（従来どおり）。API 接続版を配信する場合は
          # secrets API_BASE_URL / FIREBASE_WEB_CONFIG を設定する（setup-deploy-secrets.ps1）
          NUXT_PUBLIC_API_BASE: ${{ secrets.API_BASE_URL }}
          NUXT_PUBLIC_FIREBASE_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: npm run generate

      - name: デプロイ先チャネルを決定
        id: channel
        run: |
          if [ "${{ needs.preflight.outputs.environment }}" = "production" ]; then
            echo "channel=live" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Firebase Hosting へデプロイ
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: ${{ steps.channel.outputs.channel }}
          entryPoint: home

      - name: デプロイ結果をサマリーへ記録
        if: always()
        run: |
          echo "- ✅ **home デプロイ**: 環境 ${{ needs.preflight.outputs.environment }} / チャネル ${{ steps.channel.outputs.channel }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # デプロイ（company / Firebase Hosting マルチサイト）: 全テストゲート通過 +
  # FIREBASE_HOSTING_SITE_COMPANY 登録時のみ実行。サイト ID はリポジトリに持たず、
  # デプロイ時に .firebaserc を生成して firebase.json の hosting.target（company）へ紐付ける。
  # ---------------------------------------------------------------------------
  deploy-company:
    name: デプロイ実行（company / Firebase Hosting）
    needs: [preflight, test]
    if: needs.preflight.outputs.company_ready == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: company/package-lock.json

      - name: 依存インストール
        working-directory: company
        run: npm ci

      - name: 静的ビルド
        working-directory: company
        env:
          # 未設定なら完全モックモード。API 接続版を配信する場合は secrets を設定する
          # （API 側は API_CORS_ORIGINS に本サイトのオリジン追加が必要 = deploy-guide.md §1-11）
          NUXT_PUBLIC_API_BASE: ${{ secrets.API_BASE_URL }}
          NUXT_PUBLIC_FIREBASE_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: npm run generate

      - name: Hosting ターゲット定義（.firebaserc）を生成
        working-directory: company
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          SITE: ${{ secrets.FIREBASE_HOSTING_SITE_COMPANY }}
        run: |
          jq -n --arg project "$PROJECT" --arg site "$SITE" \
            '{projects: {default: $project}, targets: {($project): {hosting: {company: [$site]}}}}' \
            > .firebaserc

      - name: デプロイ先チャネルを決定
        id: channel
        run: |
          if [ "${{ needs.preflight.outputs.environment }}" = "production" ]; then
            echo "channel=live" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Firebase Hosting へデプロイ
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: ${{ steps.channel.outputs.channel }}
          entryPoint: company
          target: company

      - name: デプロイ結果をサマリーへ記録
        if: always()
        run: |
          echo "- ✅ **company デプロイ**: 環境 ${{ needs.preflight.outputs.environment }} / チャネル ${{ steps.channel.outputs.channel }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # デプロイ（intelligence / Firebase Hosting マルチサイト）: deploy-company と同型。
  # ---------------------------------------------------------------------------
  deploy-intelligence:
    name: デプロイ実行（intelligence / Firebase Hosting）
    needs: [preflight, test]
    if: needs.preflight.outputs.intelligence_ready == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: intelligence/package-lock.json

      - name: 依存インストール
        working-directory: intelligence
        run: npm ci

      - name: 静的ビルド
        working-directory: intelligence
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.API_BASE_URL }}
          NUXT_PUBLIC_FIREBASE_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: npm run generate

      - name: Hosting ターゲット定義（.firebaserc）を生成
        working-directory: intelligence
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          SITE: ${{ secrets.FIREBASE_HOSTING_SITE_INTELLIGENCE }}
        run: |
          jq -n --arg project "$PROJECT" --arg site "$SITE" \
            '{projects: {default: $project}, targets: {($project): {hosting: {intelligence: [$site]}}}}' \
            > .firebaserc

      - name: デプロイ先チャネルを決定
        id: channel
        run: |
          if [ "${{ needs.preflight.outputs.environment }}" = "production" ]; then
            echo "channel=live" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Firebase Hosting へデプロイ
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: ${{ steps.channel.outputs.channel }}
          entryPoint: intelligence
          target: intelligence

      - name: デプロイ結果をサマリーへ記録
        if: always()
        run: |
          echo "- ✅ **intelligence デプロイ**: 環境 ${{ needs.preflight.outputs.environment }} / チャネル ${{ steps.channel.outputs.channel }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # デプロイ（api / Cloud Run）: 全テストゲート通過 + production + api 設定値ありのときのみ実行。
  # staging は別途プロビジョニングが必要なため対象外（preflight で通知済み）。
  # ---------------------------------------------------------------------------
  deploy-api:
    name: デプロイ実行（api / Cloud Run）
    needs: [preflight, test]
    if: needs.preflight.outputs.api_ready == 'true' && needs.preflight.outputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Artifact Registry リポジトリを用意（冪等）
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud artifacts repositories describe akebono-office --location="$REGION" >/dev/null 2>&1 \
            || gcloud artifacts repositories create akebono-office \
                 --repository-format=docker --location="$REGION" \
                 --description="akebono-office コンテナイメージ"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: イメージをビルドしてプッシュ
        env:
          REGION: ${{ secrets.GCP_REGION }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/akebono-office/$SERVICE:$GITHUB_SHA"
          docker build -f api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: DATABASE_URL を Secret Manager へ登録（冪等）
        env:
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          SECRET_NAME="$SERVICE-database-url"
          if ! gcloud secrets describe "$SECRET_NAME" >/dev/null 2>&1; then
            gcloud secrets create "$SECRET_NAME" --replication-policy=automatic
          fi
          # 値が変わったときだけ新バージョンを追加（毎回の無駄なバージョン増加を防ぐ）
          CURRENT="$(gcloud secrets versions access latest --secret="$SECRET_NAME" 2>/dev/null || true)"
          if [ "$CURRENT" != "$DATABASE_URL" ]; then
            printf '%s' "$DATABASE_URL" | gcloud secrets versions add "$SECRET_NAME" --data-file=-
          fi
          # 実行サービスアカウント（既定: Compute Engine 既定 SA）へ読取権限を付与（冪等）
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')"
          gcloud secrets add-iam-policy-binding "$SECRET_NAME" \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor" --quiet >/dev/null

      # 外部連携（カレンダー F-06-8 / 通知の AKEBONO HOME 名義化 2026-08-20）: 資格情報を Secret Manager へ。
      # secrets 未設定の連携はスキップ（無効のままデプロイ継続 = 原則4）。repository secrets の登録だけで
      # 自動配線される（デプロイ障害 2026-08-20 の教訓: 手動の gcloud run services update 前提にしない = 原則1/3）
      # - カレンダー: GOOGLE_OAUTH_CLIENT_SECRET + TOKEN_ENCRYPTION_KEY（個人 OAuth トークンの暗号化鍵）
      # - Slack: SLACK_BOT_TOKEN（Bot Token 方式 = AKEBONO HOME 名義。旧 SLACK_CLIENT_ID/SECRET は廃止）
      # - Google Chat: GOOGLE_CHAT_SA_KEY（Chat アプリのサービスアカウント鍵 JSON = AKEBONO HOME 名義）
      - name: 外部連携の secrets を Secret Manager へ登録（冪等・任意）
        env:
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_CHAT_SA_KEY: ${{ secrets.GOOGLE_CHAT_SA_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          # 旧方式（個人 OAuth）の残存検知専用（読取のみ・配線しない。監査 R1 MINOR-1）
          LEGACY_SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
        run: |
          echo "CALENDAR_READY=false" >> "$GITHUB_ENV"
          echo "SLACK_READY=false" >> "$GITHUB_ENV"
          echo "GCHAT_READY=false" >> "$GITHUB_ENV"
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')"
          put_secret() {
            local NAME="$1" VALUE="$2"
            if ! gcloud secrets describe "$NAME" >/dev/null 2>&1; then
              gcloud secrets create "$NAME" --replication-policy=automatic
            fi
            local CURRENT
            CURRENT="$(gcloud secrets versions access latest --secret="$NAME" 2>/dev/null || true)"
            if [ "$CURRENT" != "$VALUE" ]; then
              printf '%s' "$VALUE" | gcloud secrets versions add "$NAME" --data-file=-
            fi
            gcloud secrets add-iam-policy-binding "$NAME" \
              --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
              --role="roles/secretmanager.secretAccessor" --quiet >/dev/null
          }
          # カレンダー連携（個人 OAuth）はトークン暗号化鍵が前提（保管トークンの暗号化に使用）
          if [ -n "$TOKEN_ENCRYPTION_KEY" ]; then
            put_secret "$SERVICE-token-encryption-key" "$TOKEN_ENCRYPTION_KEY"
            if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
              put_secret "$SERVICE-google-oauth-secret" "$GOOGLE_OAUTH_CLIENT_SECRET"
              echo "CALENDAR_READY=true" >> "$GITHUB_ENV"
            else
              echo "::notice::GOOGLE_OAUTH_CLIENT_SECRET が未設定のためカレンダー連携は無効のままデプロイします"
            fi
          else
            echo "::notice::TOKEN_ENCRYPTION_KEY が未設定のためカレンダー連携は無効のままデプロイします（setup-deploy-secrets.ps1 で設定）"
          fi
          # 通知連携（AKEBONO HOME 名義）はトークンを保管しないため暗号化鍵に依存しない
          if [ -n "$SLACK_BOT_TOKEN" ]; then
            put_secret "$SERVICE-slack-bot-token" "$SLACK_BOT_TOKEN"
            echo "SLACK_READY=true" >> "$GITHUB_ENV"
          elif [ -n "$LEGACY_SLACK_CLIENT_SECRET" ]; then
            # 旧方式で稼働していた環境の移行漏れは notice では気づけないため warning にする（監査 R1 MINOR-1）
            echo "::warning::旧方式の SLACK_CLIENT_SECRET を検出しましたが SLACK_BOT_TOKEN が未登録です。AKEBONO HOME 名義化により旧方式は廃止されたため、このままでは Slack 通知が停止します（deploy-guide.md §1-12 の移行手順で Bot Token を登録してください）"
          else
            echo "::notice::SLACK_BOT_TOKEN が未設定のため Slack 通知連携は無効のままデプロイします"
          fi
          if [ -n "$GOOGLE_CHAT_SA_KEY" ]; then
            put_secret "$SERVICE-google-chat-sa-key" "$GOOGLE_CHAT_SA_KEY"
            echo "GCHAT_READY=true" >> "$GITHUB_ENV"
          else
            echo "::notice::GOOGLE_CHAT_SA_KEY が未設定のため Google Chat 通知連携は無効のままデプロイします"
          fi

      # AI 機能（Vertex AI）とカレンダー同期（Calendar API）の有効化 + 実行 SA への権限付与。
      # 補助処理として非ブロッキング（権限不足時は警告 + deploy-guide.md の手動手順へフォールバック）
      - name: Vertex AI / Calendar API の有効化 + 実行 SA へ権限付与（冪等・非ブロッキング）
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud services enable aiplatform.googleapis.com --project "$PROJECT" \
            || echo "::warning::aiplatform.googleapis.com の有効化に失敗しました。オーナー権限で 'gcloud services enable aiplatform.googleapis.com' を実行してください（deploy-guide.md 参照）"
          # カレンダー同期（events API）に必要。OAuth トークン交換は Calendar API 無効でも成功するため見落としやすい
          gcloud services enable calendar-json.googleapis.com --project "$PROJECT" \
            || echo "::warning::calendar-json.googleapis.com の有効化に失敗しました。オーナー権限で 'gcloud services enable calendar-json.googleapis.com' を実行してください（deploy-guide.md 参照）"
          # ドキュメント管理のドライブ取込（バッチ7l）。OAuth 連携と同じ資格情報で drive.readonly を使う
          gcloud services enable drive.googleapis.com --project "$PROJECT" \
            || echo "::warning::drive.googleapis.com の有効化に失敗しました。オーナー権限で有効化してください（deploy-guide.md 参照）"
          # データ取込の Google スプレッドシート連携（F-32 sheets_pull・2026-08-03）。値読取 = Sheets API /
          # ブック一覧 = Drive API（上記）。OAuth のトークン交換は Sheets API 無効でも成功するため見落としやすい
          gcloud services enable sheets.googleapis.com --project "$PROJECT" \
            || echo "::warning::sheets.googleapis.com の有効化に失敗しました。オーナー権限で有効化してください（deploy-guide.md §1-9c 参照）"
          # メディア分析の GA 連携（F-40）。集計 = Data API / プロパティ一覧 = Admin API。
          # OAuth のトークン交換は両 API 無効でも成功するため見落としやすい（deploy-guide §1-9b）
          gcloud services enable analyticsdata.googleapis.com --project "$PROJECT" \
            || echo "::warning::analyticsdata.googleapis.com の有効化に失敗しました。オーナー権限で有効化してください（deploy-guide.md §1-9b 参照）"
          gcloud services enable analyticsadmin.googleapis.com --project "$PROJECT" \
            || echo "::warning::analyticsadmin.googleapis.com の有効化に失敗しました。オーナー権限で有効化してください（deploy-guide.md §1-9b 参照）"
          # 通知の Google Chat 連携（AKEBONO HOME 名義 = Chat アプリ）。従来は deploy-guide の手動手順のみで
          # 有効化漏れが本番障害（テスト送信 502）の原因候補だったため自動化へ含める（§94-2 / 原則1）
          gcloud services enable chat.googleapis.com --project "$PROJECT" \
            || echo "::warning::chat.googleapis.com の有効化に失敗しました。オーナー権限で有効化してください（deploy-guide.md §1-12 参照）"
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')"
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/aiplatform.user" --condition=None --quiet >/dev/null \
            || echo "::warning::実行 SA への roles/aiplatform.user 付与に失敗しました。オーナー権限で付与してください（deploy-guide.md 参照）"

      # ドキュメント保管（バッチ7l = Firebase の Cloud Storage バケット）。STORAGE_BUCKET secret 登録時のみ。
      # 未登録の環境は DB bytea フォールバックで全機能が動作する（署名 URL のみ GCS 専用）
      - name: ドキュメント保管（Cloud Storage）の準備（冪等・非ブロッキング）
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
        run: |
          if [ -z "$STORAGE_BUCKET" ]; then
            echo "STORAGE_BUCKET 未設定のためスキップ（DB フォールバック保管で動作します）"
            exit 0
          fi
          # 署名 URL（IAM signBlob）に必要
          gcloud services enable iamcredentials.googleapis.com --project "$PROJECT" \
            || echo "::warning::iamcredentials.googleapis.com の有効化に失敗しました（署名 URL が使えません。base64 ダウンロードへ縮退）"
          # バケットが無ければ作成（Firebase の既定バケットが既にあれば no-op）。公開アクセスは禁止
          if ! gcloud storage buckets describe "gs://$STORAGE_BUCKET" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://$STORAGE_BUCKET" --project "$PROJECT" \
              --location "${REGION:-asia-northeast1}" --uniform-bucket-level-access \
              || echo "::warning::バケット作成に失敗しました。Firebase コンソールで Cloud Storage を有効化するか手動作成してください"
          fi
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')"
          RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          gcloud storage buckets add-iam-policy-binding "gs://$STORAGE_BUCKET" \
            --member="serviceAccount:${RUNTIME_SA}" --role="roles/storage.objectAdmin" >/dev/null \
            || echo "::warning::実行 SA への storage.objectAdmin 付与に失敗しました。オーナー権限で付与してください"
          # 実行 SA が自分自身で signBlob する（署名 URL の生成）ための権限
          gcloud iam service-accounts add-iam-policy-binding "$RUNTIME_SA" \
            --member="serviceAccount:${RUNTIME_SA}" --role="roles/iam.serviceAccountTokenCreator" --project "$PROJECT" >/dev/null \
            || echo "::warning::実行 SA への iam.serviceAccountTokenCreator（self）付与に失敗しました。署名 URL は base64 ダウンロードへ縮退します"

      - name: Cloud Run へデプロイ
        env:
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          DB_SSL: ${{ secrets.DB_SSL }}
          API_CORS_ORIGINS: ${{ secrets.API_CORS_ORIGINS }}
          VERTEX_LOCATION: ${{ secrets.VERTEX_LOCATION }}
          VERTEX_MODEL: ${{ secrets.VERTEX_MODEL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          # 常時稼働インスタンス数（repository variable。未設定は 1 = 常に 1 台を暖機してコールドスタートを避ける）。
          # コスト最優先なら 0 に設定（アイドル時ゼロスケール = 従来。ただし初回リクエストにコールドスタート遅延が戻る）
          CLOUD_RUN_MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES }}
        run: |
          # 区切りは gcloud の ^@^ 構文（gcloud topic escaping）で「@」にする（デプロイ障害 2026-08-20）:
          # マルチサイト化（PR #137）で API_CORS_ORIGINS が複数オリジンのカンマ区切りになり、
          # 既定のカンマ区切りでは CORS_ORIGINS の値が key=value 対として誤解釈され
          # 「Bad syntax for dict arg」でデプロイが失敗するため（値にカンマを含められる区切りへ変更）
          ENV_VARS="AUTH_MODE=firebase@FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}@DB_SSL=${DB_SSL:-require}@CORS_ORIGINS=${API_CORS_ORIGINS}@VERTEX_PROJECT_ID=${PROJECT}@VERTEX_LOCATION=${VERTEX_LOCATION:-global}@VERTEX_MODEL=${VERTEX_MODEL:-gemini-2.5-flash}"
          # ドキュメント保管（バッチ7l）。未設定 = DB bytea フォールバック
          if [ -n "$STORAGE_BUCKET" ]; then
            ENV_VARS="$ENV_VARS@STORAGE_BUCKET=${STORAGE_BUCKET}"
          fi
          SECRET_FLAGS="DATABASE_URL=$SERVICE-database-url:latest"
          # 外部連携（secrets 登録済みのときのみ有効化）
          if [ "${CALENDAR_READY:-false}" = "true" ] && [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            ENV_VARS="$ENV_VARS@GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}"
            SECRET_FLAGS="$SECRET_FLAGS,GOOGLE_OAUTH_CLIENT_SECRET=$SERVICE-google-oauth-secret:latest,TOKEN_ENCRYPTION_KEY=$SERVICE-token-encryption-key:latest"
          elif [ "${CALENDAR_READY:-false}" = "true" ]; then
            # 片側登録の検知（シークレットのみ・ID 欠落 = 無言スキップにしない。レビュー R1）
            echo "::warning::GOOGLE_OAUTH_CLIENT_ID が未設定のためカレンダー連携は配線されません（GOOGLE_OAUTH_CLIENT_SECRET は登録済み。ID も repository secrets へ登録してください）"
          fi
          # 通知連携（AKEBONO HOME 名義化 2026-08-20。repository secrets の登録だけで有効化。
          # トークンを保管しないため TOKEN_ENCRYPTION_KEY には依存しない）
          if [ "${SLACK_READY:-false}" = "true" ]; then
            SECRET_FLAGS="$SECRET_FLAGS,SLACK_BOT_TOKEN=$SERVICE-slack-bot-token:latest"
          fi
          if [ "${GCHAT_READY:-false}" = "true" ]; then
            SECRET_FLAGS="$SECRET_FLAGS,GOOGLE_CHAT_SA_KEY=$SERVICE-google-chat-sa-key:latest"
          fi
          # --no-cpu-throttling: AI タスクの承認後自動実行（バッチ7i = HTTP 応答後のバックグラウンド
          # LLM 実行）を応答返却後も CPU 割当されたまま走らせるため（PR #58 R1 C-2）。
          # --min-instances: 既定 1 = 常に 1 台を暖機し、アイドル後の初回リクエストのコールドスタート遅延
          # （コンテナ起動 + DB プール確立で数秒〜十数秒）を解消する。オペレーター報告 2026-07-30
          # （取込元の登録が異常に遅い / 無効化がタイムアウトで失敗）への対処。repository variable
          # CLOUD_RUN_MIN_INSTANCES=0 でコスト優先のゼロスケール（従来挙動）へ戻せる。
          MIN_INSTANCES="${CLOUD_RUN_MIN_INSTANCES:-1}"
          # --cpu-boost: 残るコールドスタート（スパイク時の 2〜3 台目）の起動を高速化（低リスク。
          # CLI フラグは --cpu-boost。--startup-cpu-boost は KRM アノテーション名で CLI では不正）
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances "$MIN_INSTANCES" \
            --max-instances 3 \
            --no-cpu-throttling \
            --cpu-boost \
            --set-env-vars "^@^$ENV_VARS" \
            --set-secrets "$SECRET_FLAGS"
          echo "デプロイ完了: $(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"

      - name: デプロイ結果をサマリーへ記録
        if: always()
        run: |
          echo "- ✅ **api デプロイ**: 環境 production / サービス ${{ secrets.CLOUD_RUN_SERVICE }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 最終レポート: 成否にかかわらずパイプライン全体の結果を Step Summary に記録
  # ---------------------------------------------------------------------------
  report:
    name: パイプライン結果レポート
    needs: [preflight, test, deploy-home, deploy-company, deploy-intelligence, deploy-api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 結果サマリーを出力
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_HOME_RESULT: ${{ needs.deploy-home.result }}
          DEPLOY_COMPANY_RESULT: ${{ needs.deploy-company.result }}
          DEPLOY_INTELLIGENCE_RESULT: ${{ needs.deploy-intelligence.result }}
          DEPLOY_API_RESULT: ${{ needs.deploy-api.result }}
          TARGET_ENV: ${{ needs.preflight.outputs.environment }}
          API_READY: ${{ needs.preflight.outputs.api_ready }}
          COMPANY_READY: ${{ needs.preflight.outputs.company_ready }}
          INTELLIGENCE_READY: ${{ needs.preflight.outputs.intelligence_ready }}
        run: |
          to_mark() {
            case "$1" in
              success)   echo "✅ 成功" ;;
              failure)   echo "❌ 失敗" ;;
              skipped)   echo "⏭️ スキップ" ;;
              cancelled) echo "🚫 キャンセル" ;;
              *)         echo "$1" ;;
            esac
          }

          {
            echo "# デプロイパイプライン結果（環境: ${TARGET_ENV:-production}）"
            echo ""
            echo "| ステージ | 結果 |"
            echo "|---------|------|"
            echo "| 事前検証 | $(to_mark "$PREFLIGHT_RESULT") |"
            echo "| テストゲート（単体・結合・シナリオ） | $(to_mark "$TEST_RESULT") |"
            echo "| デプロイ（home / Firebase Hosting） | $(to_mark "$DEPLOY_HOME_RESULT") |"
            echo "| デプロイ（company / Firebase Hosting） | $(to_mark "$DEPLOY_COMPANY_RESULT") |"
            echo "| デプロイ（intelligence / Firebase Hosting） | $(to_mark "$DEPLOY_INTELLIGENCE_RESULT") |"
            echo "| デプロイ（api / Cloud Run） | $(to_mark "$DEPLOY_API_RESULT") |"
            echo ""
            if [ "$DEPLOY_COMPANY_RESULT" = "skipped" ] && [ "$COMPANY_READY" != "true" ]; then
              echo "ℹ️ company は FIREBASE_HOSTING_SITE_COMPANY 未登録のためスキップしました（deploy-guide.md §1-11）。"
            fi
            if [ "$DEPLOY_INTELLIGENCE_RESULT" = "skipped" ] && [ "$INTELLIGENCE_READY" != "true" ]; then
              echo "ℹ️ intelligence は FIREBASE_HOSTING_SITE_INTELLIGENCE 未登録のためスキップしました（deploy-guide.md §1-11）。"
            fi
            if [ "$DEPLOY_API_RESULT" = "skipped" ]; then
              if [ "${TARGET_ENV}" != "production" ]; then
                echo "ℹ️ api は staging では対象外です（フロントのみ staging プレビューへデプロイ）。"
              elif [ "$API_READY" != "true" ]; then
                echo "ℹ️ api デプロイ用 secrets が未設定のため api はスキップしました（フロントのみデプロイ）。"
              fi
              echo ""
            fi
            if [ "$PREFLIGHT_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ] \
               && [ "$DEPLOY_HOME_RESULT" = "success" ]; then
              echo "🎉 デプロイが完了しました（環境: ${TARGET_ENV:-production}）。"
            else
              echo "⚠️ デプロイは完了していません。失敗したステージの Step Summary と"
              echo "アーティファクト \`deploy-logs\` で「何がどのように失敗したか」を確認し、"
              echo "修正後に再実行してください。対処手順: \`.ai-native/outputs/phase7/deploy-guide.md\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
